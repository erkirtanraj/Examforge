name: Deploy React frontend to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Validate deployment configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "::error::Set repository variable FIREBASE_PROJECT_ID."; exit 1; }
          test -n "$REACT_APP_BACKEND_URL" || { echo "::error::Set repository variable REACT_APP_BACKEND_URL to the API HTTPS base URL."; exit 1; }
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "::error::Set repository secret FIREBASE_SERVICE_ACCOUNT."; exit 1; }
          case "$REACT_APP_BACKEND_URL" in https://*) ;; *) echo "::error::REACT_APP_BACKEND_URL must use HTTPS."; exit 1 ;; esac
          case "$REACT_APP_BACKEND_URL" in */) echo "::error::REACT_APP_BACKEND_URL must not end with a slash."; exit 1 ;; esac

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: yarn build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
