name: MySQL M1 Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "backend/mysql_persistence/**"
      - "backend/alembic.ini"
      - "backend/alembic/**"
      - "backend/requirements-mysql.txt"
      - "backend/tests/mysql_migration/**"
      - ".github/workflows/mysql-m1-tests.yml"
  push:
    branches: [feature/mysql-full-migration]
    paths:
      - "backend/mysql_persistence/**"
      - "backend/alembic.ini"
      - "backend/alembic/**"
      - "backend/requirements-mysql.txt"
      - "backend/tests/mysql_migration/**"
      - ".github/workflows/mysql-m1-tests.yml"

permissions:
  contents: read

concurrency:
  group: mysql-m1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-m1-unit-tests:
    name: M1 unit tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-mysql.txt

      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.110.1" "starlette==0.37.2" "httpx==0.28.1" "pytest==9.1.1" "pytest-xdist==3.8.0"
          python -m pip install -r requirements-mysql.txt

      - name: Run M1 tests
        run: python -m pytest -n 0 tests/mysql_migration
